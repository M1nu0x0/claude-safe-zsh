name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Daily against the latest Claude Code, which can change how CLAUDE_ENV_FILE works between releases,
  # and to see whether the upstream issue has been fixed.
  schedule:
    - cron: "17 18 * * *" # 03:17 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Record the Claude Code version
        shell: bash
        run: echo "::notice title=Claude Code (${{ runner.os }})::$(claude --version)"

      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh

      - name: Record the zsh version
        run: echo "::notice title=zsh (${{ runner.os }})::$(zsh --version)"

      - name: Validate the marketplace
        run: claude plugin validate .

      - name: Validate the plugin
        run: claude plugin validate plugins/safe-zsh

      - name: Type check the tests (JSDoc, checkJs, strict)
        if: runner.os == 'Linux'
        run: |
          npm ci
          npm run typecheck

      - name: Unit tests
        run: node --test 'plugins/safe-zsh/tests/*.test.mjs'

      - name: Build the site and check it as a crawler reads it
        if: runner.os == 'Linux'
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: The sitemap's lastmod moves with the site's text
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        working-directory: site
        run: |
          git fetch -q --depth=1 origin "$GITHUB_BASE_REF"
          npx plugin-site lastmod FETCH_HEAD

      - name: Engine env file (SessionStart without login)
        timeout-minutes: 3
        run: bash .github/ci/engine-env.sh

  upstream:
    name: upstream issue
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - name: Check anthropics/claude-code#103027 and #104925
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 103027: Claude writes bash under zsh, the reason for the plugin. 104925: the safety check cannot parse zsh
          # ${(flags)...}, the reason for the PreToolUse hook and its hint.
          for n in 103027 104925; do
            state=$(gh api "repos/anthropics/claude-code/issues/$n" --jq '.state + " " + (.state_reason // "")')
            echo "::notice title=anthropics/claude-code#$n::$state"
            case "$n $state" in
              "103027 closed completed")
                echo "::warning title=upstream fixed::anthropics/claude-code#103027 is closed as completed. Check whether Claude Code now handles zsh, and if so retire this plugin." ;;
              "104925 closed completed")
                echo "::warning title=upstream fixed::anthropics/claude-code#104925 is closed as completed. Check whether the safety check now parses zsh \${(flags)...}, and if so remove the PreToolUse hook and its SessionStart hint." ;;
            esac
          done
